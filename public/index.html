<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Students AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="glow.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <!-- ===== MOBILE LAYOUT (phone par drawer + full-screen chat) ===== -->
  <style>
    #menuBtn, #backdrop { display: none; }

    @media (max-width: 768px) {
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body.app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
      }

      /* Sidebar: left se slide hone wala drawer */
      #side {
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        width: 80%;
        max-width: 300px;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 1000;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px 12px;
        margin: 0;
      }
      body.side-open #side { transform: translateX(0); }
      #side button { width: 100%; font-size: 15px; padding: 12px; }

      body.side-open #backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 999;
      }

      /* Main: poori screen */
      #main {
        width: 100%;
        min-width: 0;
        height: 100dvh;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0;
        margin: 0;
      }

      /* Top bar */
      #top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 8px 10px;
        flex-wrap: nowrap;
      }
      #menuBtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        font-size: 22px;
        border: none;
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
      }
      #top > div { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      #top button { font-size: 12px; padding: 6px 8px; }

      /* Chat: scroll hoga, input neeche rahega */
      #chat {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px;
        -webkit-overflow-scrolling: touch;
      }

      #form {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        flex-shrink: 0;
      }
      #input {
        flex: 1;
        min-width: 0;
        font-size: 16px; /* chhota font ho to phone zoom karta hai */
        padding: 12px 14px;
        border-radius: 999px;
      }
      #form button { flex-shrink: 0; border-radius: 999px; padding: 10px 14px; }
      #form select { max-width: 90px; font-size: 13px; }
    }
  </style>
</head>
<body class="app">
  <aside id="side">
    <div id="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2563eb" />
            <stop offset="1" stop-color="#7c3aed" />
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#lg)" />
        <path d="M16 7 L26 12 L16 17 L6 12 Z" fill="#ffffff" />
        <path d="M10 14 V20 C10 22 13 23 16 23 C19 23 22 22 22 20 V14 L16 17 Z" fill="#dbeafe" />
        <path d="M26 12 V18" stroke="#ffffff" stroke-width="1.5" />
      </svg>
      <span>Students AI</span>
    </div>
    <button id="homeBtn">🏠 Home Page</button>
    <button id="newChat">✨ New Chat</button>

    <button id="notesBtn">📝 My Notes</button>
    <button id="bookBtn">📚 CBSE / BSEB Books</button>
    <button id="doubtBtn">🧮 AI Doubt Solver</button>
    <button id="quizBtn">🎯 AI Quiz</button>
    <button id="analyticsBtn" type="button">📊 Performance</button>
    <button id="qgenBtn">📝 Questions Genrator</button>
    <button id="examBtn">🏆 Exam Preparation</button>
    <button id="checkBtn">✍️ Answer Check</button>
    <button id="gamifyBtn" type="button">🏅 Study Game</button>
    <button id="guidanceBtn" type="button">🧭 Career & Skills</button>

    <div id="list"></div>
  </aside>

  <div id="backdrop"></div>

  <section id="main">
    <div id="top">
      <button id="menuBtn" aria-label="Menu">☰</button>
      <span id="who"></span>
      <div>
        <button id="theme" title="Theme Change">🌙</button>
        <button id="logout">Logout</button>
      </div>
    </div>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="Write Message..." autocomplete="off" />
      <button>Send</button>
    </form>
  </section>

  <script src="script.js"></script>
  <script src="books.js"></script>
  <script src="doubt.js"></script>
  <script src="quiz.js"></script>

  <script src="questions.js"></script>
  <script src="exam.js"></script>
  <script src="check.js"></script>
  <script src="history.js"></script>
  <script src="welcome.js"></script>
  <script src="home.js"></script>
  <script src="analytics.js"></script>
  <script src="guidance.js"></script>
  <script src="gamify.js"></script>
  <script src="voice.js"></script>
  <script src="donate.js"></script>
  <script src="profile.js"></script>
  <script src="rich.js"></script>
  <script src="about.js"></script>
  <script src="hero.js"></script>

  <!-- Mobile drawer: ☰ se kholna, bahar click ya sidebar button se band -->
  <script>
    (function () {
      const body = document.body;
      const menuBtn = document.getElementById('menuBtn');
      const backdrop = document.getElementById('backdrop');
      const side = document.getElementById('side');

      const openSide = () => body.classList.add('side-open');
      const closeSide = () => body.classList.remove('side-open');

      menuBtn.addEventListener('click', () => {
        body.classList.contains('side-open') ? closeSide() : openSide();
      });
      backdrop.addEventListener('click', closeSide);
      side.addEventListener('click', (e) => {
        if (e.target.closest('button')) closeSide();
      });
    })();
  </script>
</body>
</html>
