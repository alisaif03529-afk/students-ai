<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Students AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="stage">
    <div class="wrap">
      <div class="ring" id="ring" aria-hidden="true"></div>

      <div class="circle">
        <form class="form" id="authForm" novalidate>
          <div class="content" id="content">
            <h1 id="title">Sign Up</h1>
            <p class="sub" id="sub">Create your account</p>

            <div class="field" id="nameWrap">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <input id="name" type="text" placeholder="Full name" autocomplete="name" />
            </div>

            <div class="field">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <input id="email" type="email" placeholder="Email" autocomplete="email" />
            </div>

            <div class="field">
              <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
            </div>

            <button class="btn" id="submit" type="submit">CREATE ACCOUNT</button>

            <p class="switch">
              <span id="swText">Already have an account?</span>
              <button type="button" class="link" id="swBtn">Login</button>
            </p>
          </div>

          <p class="error" id="error" role="alert"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
