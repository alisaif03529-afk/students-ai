<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Students AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="brand-top">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fbbf24" />
          <stop offset="1" stop-color="#f472b6" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="9" fill="url(#bl)" />
      <path d="M16 7 L26 12 L16 17 L6 12 Z" fill="#ffffff" />
      <path d="M10 14 V20 C10 22 13 23 16 23 C19 23 22 22 22 20 V14 L16 17 Z" fill="#fef3c7" />
      <path d="M26 12 V18" stroke="#ffffff" stroke-width="1.5" />
    </svg>
    <span>Students AI</span>
  </div>

  <main class="room">
    <form id="authForm" class="card" data-neon>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="login">Login</button>
        <button type="button" class="tab" data-mode="signup">Sign Up</button>
      </div>

      <h2 id="title">Welcome Back</h2>
      <p class="sub" id="sub">अपने अकाउंट में लॉगिन करें</p>

      <div class="name-wrap" id="nameWrap">
        <input id="name" placeholder="👤 आपका नाम" autocomplete="name" />
      </div>
      <input id="email" type="email" placeholder="✉️ Email Address" required />
      <input id="password" type="password" placeholder="🔒 Password" required />

      <p id="error" class="error" role="alert"></p>

      <button id="submit" class="yellow" type="submit">Sign In</button>

      <div class="or"><span>OR CONTINUE WITH</span></div>
      <div class="social">
        <button type="button" class="soc">G Google</button>
        <button type="button" class="soc">GitHub</button>
      </div>
    </form>
  </main>

  <div id="fireflies"></div>
  <script src="neon-ring.js"></script>
  <script src="login.js"></script>
</body>
</html>
